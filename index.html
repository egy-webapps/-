<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12263f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Smart Micro-POS | كاشير وديون</title>
<style>
:root{--ink:#10243a;--paper:#eef1f4;--card:#fff;--tx:#14202e;--mut:#66758a;--bd:#d9e0e8;--brass:#d99a1c;--ok:#1f8a5b;--bad:#c2412d}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Segoe UI",Tahoma,system-ui,sans-serif;background:var(--paper);color:var(--tx);padding-bottom:76px;line-height:1.5}
header{background:var(--ink);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10;font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center}
header small{font-weight:400;opacity:.7;font-size:12px}
main{max-width:1000px;margin:0 auto;padding:12px}
h3{margin-bottom:8px}
.mut,small{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}
.row input{width:110px;margin:0}
.pos{display:grid;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:8px;align-content:start}
.pi{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:center;cursor:pointer;user-select:none}
.pi:active{background:#e4eaf0}
.pi b{display:block;margin-bottom:2px}
.pi.out{opacity:.45}
.lo{color:var(--bad);font-weight:700}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--bd);background:var(--paper);font-size:18px;cursor:pointer}
.btn{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.gold{background:var(--brass);color:#1b1300}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.bad{background:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btns{display:flex;gap:8px;margin-top:10px}.btns .btn{flex:1}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:#fff;color:var(--tx);font:inherit;margin:4px 0 8px}
input[type=radio]{width:auto;margin:0 0 0 6px}
.seg{display:flex;gap:10px;margin:8px 0}
.seg label{flex:1;border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:center;cursor:pointer}
.total{font-size:22px;font-weight:800}
.big{font-size:28px;font-weight:800;text-align:center;margin:6px 0}
.tag{font-size:12px;padding:2px 8px;border-radius:20px;color:#fff}
.tag.cash{background:var(--ok)}.tag.credit{background:var(--brass);color:#1b1300}
.debt{color:var(--bad);font-weight:800}
.fab{position:fixed;bottom:80px;left:12px;z-index:9;box-shadow:0 4px 14px #0004}
nav{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--bd);display:flex;z-index:20}
nav button{flex:1;border:0;background:none;padding:8px 0 10px;font:inherit;font-size:12px;color:var(--mut);cursor:pointer}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--ink);font-weight:800;box-shadow:inset 0 3px 0 var(--brass)}
.mb{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:50}
.mb.open{display:flex}
.mc{background:#fff;width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:16px;max-height:90vh;overflow:auto}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:30px;z-index:99;display:none;font-size:14px}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
#lock{position:fixed;inset:0;background:var(--ink);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.lk{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:440px}
.lk .btn{width:100%;margin-top:6px}
.dev{font:800 22px monospace;direction:ltr;text-align:center;background:var(--paper);padding:10px;border-radius:10px;margin:6px 0}
textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;font:12px monospace;direction:ltr;margin:4px 0 8px}
@media(min-width:800px){.pos{grid-template-columns:1fr 360px;align-items:start}.fab{display:none}.mb{align-items:center}.mc{border-radius:18px}}
#cam{position:fixed;inset:0;background:#000;z-index:70;display:flex;flex-direction:column}
#cam video{flex:1;min-height:0;width:100%;object-fit:cover}
#cam .fr{position:absolute;top:36%;left:50%;width:62%;max-width:300px;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid #ff7a1a;border-radius:20px;box-shadow:0 0 0 100vmax #0005;pointer-events:none}
#cam .cb{position:relative;z-index:1;background:#fff;padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
#cmsg{font-weight:700;margin-bottom:8px;min-height:44px}
#cam .bt{display:flex;gap:8px}#cam .bt .btn{flex:1}
/* theme v2 */
:root{--ink:#12263f;--paper:#f2f5f9;--tx:#16222f;--mut:#6a7a8c;--bd:#e3e8ef;--brass:#ff7a1a;--ok:#12a150;--bad:#e5484d}
header{background:linear-gradient(135deg,#12263f 0%,#1b4d5c 60%,#1f6f6b 100%);padding:16px;box-shadow:0 4px 16px #12263f33}
header small{opacity:.8}
.card{border:0;border-radius:16px;box-shadow:0 2px 10px #12263f14}
.btn{border-radius:12px;padding:11px 16px}
.btn.gold{background:linear-gradient(135deg,#ff8a2b,#ff6a00);color:#fff;box-shadow:0 4px 12px #ff7a1a55}
.tag.credit{color:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brass);border-color:var(--brass)}
.grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pi{border:0;border-radius:16px;padding:12px 8px;box-shadow:0 2px 10px #12263f14}
.pi:active{transform:scale(.96);background:#fff}
.av{width:46px;height:46px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px}
.pi .pr{color:var(--brass);font-weight:800;font-size:17px}
nav{border:0;box-shadow:0 -4px 18px #12263f1a;border-radius:20px 20px 0 0}
nav button.on{color:var(--brass);box-shadow:none}
nav button.on span{transform:scale(1.2)}
.stats{display:flex;gap:8px;margin-bottom:10px}
.stats div{flex:1;background:#fff;border-radius:14px;padding:8px 10px;font-size:12px;color:var(--mut);box-shadow:0 2px 10px #12263f14}
.stats b{display:block;font-size:16px;color:var(--tx)}
.stats .debt{color:var(--bad)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.chip{flex:none;padding:7px 16px;border-radius:20px;background:#fff;font-size:13px;cursor:pointer;box-shadow:0 1px 4px #12263f14}
.chip.on{background:var(--ink);color:#fff}
.mc{border-radius:22px 22px 0 0}
#rcpt{display:none;font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:#000;direction:rtl;background:#fff;padding:2mm;box-sizing:border-box}
#rcpt .rc{font-size:12px;line-height:1.45}
#rcpt h2{text-align:center;font-size:17px;margin:0 0 2px}
#rcpt .c{text-align:center}
#rcpt hr{border:0;border-top:1px dashed #000;margin:5px 0}
#rcpt table{width:100%;border-collapse:collapse;font-size:12px}
#rcpt th{border-bottom:1px solid #000;text-align:right;padding:2px 0}
#rcpt td{padding:2px 0;vertical-align:top}
#rcpt .n{text-align:left}
#rcpt .t{display:flex;justify-content:space-between;font-weight:700;font-size:15px}
#rcpt .t.s{font-size:12px;font-weight:400}
#rcpt .lb{display:inline-block;margin:1mm;text-align:center;font-size:11px;line-height:1.3;border:1px dashed #999;padding:1mm;box-sizing:border-box;vertical-align:top;page-break-inside:avoid}
#rcpt .lq{width:24mm;height:24mm;margin:1mm auto}
@media print{body>*:not(#rcpt){display:none!important}#rcpt{display:block!important}}
</style>
</head>
<body>
<header><div id="sn">متجري</div><small>Smart Micro-POS</small></header>
<main id="view"></main>
<button class="btn gold fab" id="fab" onclick="document.getElementById('cart').scrollIntoView({behavior:'smooth'})" hidden></button>
<nav id="nav"></nav>
<div class="mb" id="mb" onclick="if(event.target===this)closeM()"></div>
<div id="toast"></div>
<input type="file" id="file" accept=".json,application/json" hidden onchange="importDb(this)">

<script>
'use strict';
const KEY='smartpos_v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const sid=s=>String(s||'').replace(/[^\w-]/g,'')||uid();
const num=x=>Number.isFinite(+x)?+x:0;
const round=n=>Math.round(n*100)/100;
const fmt=n=>round(n).toLocaleString('en-US');
const fdate=d=>new Date(d).toLocaleString('en-GB',{dateStyle:'short',timeStyle:'short'});
const TABS=[['pos','🛒','كاشير'],['prod','📦','المنتجات'],['cus','👥','الديون'],['inv','🧾','الفواتير'],['set','⚙️','الإعدادات']];

function norm(d){
  const A=x=>Array.isArray(x)?x:[];
  const inv=A(d.invoices).map(i=>({id:sid(i.id),no:num(i.no),date:i.date||new Date().toISOString(),
    items:A(i.items).map(t=>({name:String(t.name||''),price:num(t.price),qty:num(t.qty),cost:num(t.cost)})),
    sub:num(i.sub),disc:num(i.disc),total:num(i.total),paid:num(i.paid),
    method:i.method==='credit'?'credit':'cash',cid:i.cid?sid(i.cid):null}));
  return{store:String(d.store||'متجري'),phone:String(d.phone||''),foot:String(d.foot||''),paper:d.paper==='58'?'58':'80',
    products:A(d.products).map(p=>({id:sid(p.id),name:String(p.name||''),price:num(p.price),qty:num(p.qty),cost:num(p.cost),cat:String(p.cat||''),code:String(p.code||'')})),
    customers:A(d.customers).map(c=>({id:sid(c.id),name:String(c.name||''),phone:String(c.phone||'')})),
    invoices:inv,
    payments:A(d.payments).map(p=>({id:sid(p.id),cid:sid(p.cid),amt:num(p.amt),date:p.date||new Date().toISOString()})),
    seq:Math.max(num(d.seq),1,...inv.map(i=>i.no+1))};
}
function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&typeof d==='object')return norm(d);}catch(e){}
  return norm({});
}
let db=load(),tab='pos',cart=[],disc=0,q='',cat='';
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){toast('تعذر الحفظ: مساحة التخزين ممتلئة');}}

/* ---------- helpers ---------- */
const prod=id=>db.products.find(p=>p.id===id);
const cust=id=>db.customers.find(c=>c.id===id);
function debtOf(id){
  let d=0;
  db.invoices.forEach(i=>{if(i.cid===id)d+=i.total-i.paid;});
  db.payments.forEach(p=>{if(p.cid===id)d-=p.amt;});
  return Math.max(0,round(d));
}
let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2500);}
function modal(title,body,ok,okTxt,cl){
  $('#mb').innerHTML=`<div class="mc"><h3>${title}</h3>${body}<div class="btns"><button class="btn ghost" onclick="closeM()">${cl||(ok?'إلغاء':'إغلاق')}</button>${ok?`<button class="btn" id="mok">${okTxt||'حفظ'}</button>`:''}</div></div>`;
  $('#mb').classList.add('open');
  if(ok)$('#mok').onclick=ok;
}
function closeM(){$('#mb').classList.remove('open');}
function confirmBox(msg,fn){modal('تأكيد',`<p>${esc(msg)}</p>`,()=>{closeM();fn();},'تأكيد');}

/* ---------- render ---------- */
function setTab(t){tab=t;render();window.scrollTo(0,0);}
function render(){
  $('#sn').textContent=db.store;
  $('#nav').innerHTML=TABS.map(([k,i,n])=>`<button class="${k===tab?'on':''}" onclick="setTab('${k}')"><span>${i}</span>${n}</button>`).join('');
  $('#fab').hidden=tab!=='pos';
  ({pos:vPos,prod:vProd,cus:vCus,inv:vInv,set:vSet})[tab]($('#view'));
}

/* ---------- POS ---------- */
function vPos(v){
  v.innerHTML=`${stats()}<button class="btn gold" style="width:100%;margin-bottom:8px" onclick="camOpen()">📷 مسح بالكاميرا (QR / باركود)</button><input id="q" placeholder="🔍 ابحث بالاسم أو الباركود..." value="${esc(q)}" oninput="q=this.value;grid()" onkeydown="if(event.key==='Enter')scan()"><div class="chips" id="chips"></div>
  <div class="pos"><div class="grid" id="grid"></div>
  <div class="card" id="cart"><h3>الفاتورة</h3><div id="items"></div>
    <div class="row"><span>المجموع الفرعي</span><b id="sub"></b></div>
    <div class="row"><span>الخصم (ج)</span><input type="number" min="0" inputmode="decimal" value="${disc||''}" oninput="disc=Math.max(0,+this.value||0);tot()"></div>
    <div class="row"><span>الإجمالي</span><b class="total" id="tt"></b></div>
    <div class="btns"><button class="btn ghost" onclick="cart=[];disc=0;render()">إفراغ</button><button class="btn gold" onclick="checkout()">إتمام الدفع</button></div>
  </div></div>`;
  chipsR();grid();items();
}
function grid(){
  const s=q.trim().toLowerCase();
  const l=db.products.filter(p=>(!cat||p.cat===cat)&&(p.name.toLowerCase().includes(s)||(p.code&&p.code.toLowerCase().includes(s))));
  $('#grid').innerHTML=l.length?l.map(p=>`<div class="pi ${p.qty<=0?'out':''}" onclick="add('${p.id}')"><div class="av" style="background:${col(p.name)}">${esc(p.name.trim().charAt(0))}</div><b>${esc(p.name)}</b><div class="pr">${fmt(p.price)} ج</div><small class="${p.qty<=5?'lo':''}">المتاح: ${p.qty}</small></div>`).join(''):`<p class="mut">${db.products.length?'مفيش نتايج للبحث.':'مفيش منتجات لسه. ضيفها من تبويب المنتجات.'}</p>`;
}
const COLS=['#e5484d','#f76b15','#d19a00','#12a150','#0b8a8a','#3e63dd','#8e4ec6','#d6409f'];
const col=n=>COLS[[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%COLS.length];
function stats(){
  const td=new Date().toDateString();
  const L=db.invoices.filter(i=>new Date(i.date).toDateString()===td);
  const s=L.reduce((a,i)=>a+i.total,0);
  const hasCost=db.products.some(p=>p.cost>0);
  const pf=L.reduce((a,i)=>a+i.total-i.items.reduce((b,t)=>b+(t.cost||0)*t.qty,0),0);
  const low=db.products.filter(p=>p.qty<=5).length;
  return `<div class="stats"><div>مبيعات النهارده<b>${fmt(s)} ج</b></div><div>${hasCost?'ربح النهارده':'عدد الفواتير'}<b>${hasCost?fmt(pf)+' ج':L.length}</b></div><div>قرب يخلص<b class="${low?'debt':''}">${low}</b></div></div>`;
}
function chipsR(){
  const cs=[...new Set(db.products.map(p=>p.cat).filter(Boolean))];
  if(cat&&!cs.includes(cat))cat='';
  $('#chips').innerHTML=cs.length?['',...cs].map(c=>`<span class="chip ${c===cat?'on':''}" data-c="${esc(c)}" onclick="cat=this.dataset.c;chipsR();grid()">${c?esc(c):'الكل'}</span>`).join(''):'';
}
function scan(){
  const s=q.trim(),p=db.products.find(x=>x.code&&x.code===s);
  if(p){add(p.id);q='';$('#q').value='';grid();}
}
function add(id){
  const p=prod(id),c=cart.find(x=>x.pid===id),n=(c?c.qty:0)+1;
  if(!p)return;
  if(n>p.qty)return toast('الكمية المتاحة مش كفاية');
  if(c)c.qty=n;else cart.push({pid:id,qty:1});
  items();
}
function chg(id,d){
  const c=cart.find(x=>x.pid===id),p=prod(id);
  if(!c||!p)return;
  const n=c.qty+d;
  if(n>p.qty)return toast('الكمية المتاحة مش كفاية');
  if(n<=0)cart=cart.filter(x=>x!==c);else c.qty=n;
  items();
}
function items(){
  cart=cart.filter(c=>prod(c.pid));
  $('#items').innerHTML=cart.length?cart.map(c=>{const p=prod(c.pid);
    return `<div class="row"><div><b>${esc(p.name)}</b><br><small>${fmt(p.price)} × ${c.qty} = ${fmt(p.price*c.qty)}</small></div>
    <div class="qty"><button onclick="chg('${c.pid}',-1)">−</button><b>${c.qty}</b><button onclick="chg('${c.pid}',1)">+</button></div></div>`;}).join(''):'<p class="mut">الفاتورة فاضية. اضغط على منتج لإضافته.</p>';
  tot();
}
const sub=()=>round(cart.reduce((s,c)=>s+prod(c.pid).price*c.qty,0));
const total=()=>Math.max(0,round(sub()-disc));
function tot(){
  $('#sub').textContent=fmt(sub())+' ج';
  $('#tt').textContent=fmt(total())+' ج';
  $('#fab').textContent=`🛒 ${cart.reduce((s,c)=>s+c.qty,0)} · ${fmt(total())} ج`;
}
function checkout(){
  if(!cart.length)return toast('الفاتورة فاضية');
  const t=total();
  const opts=db.customers.map(c=>`<option value="${c.id}">${esc(c.name)}${debtOf(c.id)?' (عليه '+fmt(debtOf(c.id))+')':''}</option>`).join('');
  modal('إتمام الدفع',`<div class="big">${fmt(t)} ج</div>
  <div class="seg"><label><input type="radio" name="m" value="cash" checked onchange="mChg()">كاش</label><label><input type="radio" name="m" value="credit" onchange="mChg()">آجل (دين)</label></div>
  <div id="cs2"><label>المبلغ المستلم من العميل (ج)</label><input id="rc" type="number" min="0" inputmode="decimal" oninput="chgAmt()"><div class="big" id="ch"></div></div>
  <div id="cr" hidden><label>العميل</label><select id="cs" onchange="mChg()">${opts}<option value="new">+ عميل جديد</option></select>
  <div id="nw" hidden><input id="cn" placeholder="اسم العميل"><input id="cp" inputmode="tel" placeholder="رقم الهاتف (اختياري)"></div>
  <label>المدفوع دلوقتي (ج)</label><input id="pd" type="number" min="0" inputmode="decimal" value="0"></div>`,()=>{
    if(!cart.length)return;
    for(const c of cart){const p=prod(c.pid);if(!p||c.qty>p.qty)return toast('كمية "'+(p?p.name:'منتج محذوف')+'" مش كفاية');}
    const method=document.querySelector('input[name=m]:checked').value;
    let paid=t,cid=null;
    if(method==='credit'){
      const sel=$('#cs').value;
      if(sel==='new'){
        const name=$('#cn').value.trim();
        if(!name)return toast('اكتب اسم العميل');
        cid=uid();db.customers.push({id:cid,name,phone:$('#cp').value.trim()});
      }else cid=sel;
      if(!cid)return toast('اختار العميل');
      paid=Math.min(t,Math.max(0,num($('#pd').value)));
    }
    db.invoices.push({id:uid(),no:db.seq++,date:new Date().toISOString(),
      items:cart.map(c=>{const p=prod(c.pid);return{name:p.name,price:p.price,qty:c.qty,cost:p.cost||0};}),
      sub:sub(),disc,total:t,paid,method,cid});
    cart.forEach(c=>{prod(c.pid).qty=round(prod(c.pid).qty-c.qty);});
    const rv=num($('#rc').value),last=db.invoices[db.invoices.length-1];
    cart=[];disc=0;save();render();
    modal('تم حفظ الفاتورة ✔','<div class="big">'+fmt(last.total)+' ج</div>'+(last.method==='cash'&&rv>last.total?'<div class="big" style="color:var(--ok)">الباقي للعميل: '+fmt(rv-last.total)+' ج</div>':''),()=>{closeM();printInv(last.id);},'🖨 طباعة الفاتورة','بدون طباعة');
  },'تأكيد');
  mChg();
}
function chgAmt(){const r=num($('#rc').value);$('#ch').textContent=r&&r>=total()?'الباقي: '+fmt(r-total())+' ج':'';}
function mChg(){
  const credit=document.querySelector('input[name=m]:checked').value==='credit';
  $('#cr').hidden=!credit;$('#cs2').hidden=credit;
  const sel=$('#cs').value;
  $('#nw').hidden=sel!=='new'&&!!sel;
  if(!db.customers.length)$('#cs').value='new',$('#nw').hidden=false;
}

/* ---------- Products ---------- */
function vProd(v){
  v.innerHTML=`<button class="btn" onclick="pForm()">+ منتج جديد</button><div style="height:10px"></div>`+
  (db.products.length?db.products.map(p=>`<div class="card row"><div><b>${esc(p.name)}</b><br><small>${fmt(p.price)} ج · الكمية: <span class="${p.qty<=5?'lo':''}">${p.qty}</span>${p.cat?' · '+esc(p.cat):''}${p.code?' · 🏷 '+esc(p.code):''}</small></div>
  <div class="acts"><button class="btn gold sm" onclick="qrShow('${p.id}')">QR</button><button class="btn ghost sm" onclick="pForm('${p.id}')">تعديل</button><button class="btn bad sm" onclick="pDel('${p.id}')">حذف</button></div></div>`).join(''):'<p class="mut">مفيش منتجات لسه. اضغط "منتج جديد" وابدأ.</p>');
}
function pForm(id){
  const p=prod(id)||{};
  modal(id?'تعديل منتج':'منتج جديد',`<label>الاسم</label><input id="pn" value="${esc(p.name||'')}">
  <label>السعر (ج)</label><input id="pp" type="number" min="0" inputmode="decimal" value="${p.price??''}">
  <label>الكمية في المخزن</label><input id="pq" type="number" min="0" inputmode="decimal" value="${p.qty??''}">
  <label>سعر الشراء (اختياري، لحساب الربح)</label><input id="pc" type="number" min="0" inputmode="decimal" value="${p.cost??''}">
  <label>القسم (اختياري)</label><input id="pg" list="cl" value="${esc(p.cat||'')}"><datalist id="cl">${[...new Set(db.products.map(x=>x.cat).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
  <label>الباركود / الكود (اختياري)</label><input id="pk" value="${esc(p.code||'')}">`,()=>{
    const name=$('#pn').value.trim(),price=num($('#pp').value),qty=num($('#pq').value);
    if(!name)return toast('اكتب اسم المنتج');
    if($('#pp').value===''||price<0)return toast('اكتب سعر صحيح');
    if(qty<0)return toast('الكمية لازم تكون صفر أو أكتر');
    const cost=num($('#pc').value),cat=$('#pg').value.trim(),code=$('#pk').value.trim();
    if(code&&db.products.some(x=>x.code===code&&x.id!==id))return toast('الباركود ده مستخدم في منتج تاني');
    if(id){Object.assign(p,{name,price,qty,cost,cat,code});}else db.products.push({id:uid(),name,price,qty,cost,cat,code});
    save();closeM();render();toast('تم الحفظ ✔');
  });
}
function pDel(id){const p=prod(id);confirmBox('حذف "'+p.name+'"؟ الفواتير القديمة مش هتتأثر.',()=>{db.products=db.products.filter(x=>x.id!==id);save();render();});}

/* ---------- Customers & debts ---------- */
function vCus(v){
  const all=db.customers.reduce((s,c)=>s+debtOf(c.id),0);
  v.innerHTML=`<div class="card row"><span>إجمالي الديون المستحقة</span><b class="total debt">${fmt(all)} ج</b></div>
  <button class="btn" onclick="cForm()">+ عميل جديد</button><div style="height:10px"></div>`+
  (db.customers.length?db.customers.map(c=>{const d=debtOf(c.id);
    return `<div class="card"><div class="row"><div><b>${esc(c.name)}</b><br><small>${esc(c.phone)||'—'}</small></div>
    <div>${d?`<span class="debt">${fmt(d)} ج</span>`:'<span style="color:var(--ok);font-weight:700">خالص ✔</span>'}</div></div>
    <div class="acts">${d?`<button class="btn gold sm" onclick="cPay('${c.id}')">تسجيل سداد</button>`:''}<button class="btn ghost sm" onclick="cStmt('${c.id}')">كشف حساب</button><button class="btn bad sm" onclick="cDel('${c.id}')">حذف</button></div></div>`;}).join(''):'<p class="mut">مفيش عملاء لسه. العميل بيتضاف تلقائي لما تبيع آجل.</p>');
}
function cForm(){
  modal('عميل جديد',`<label>الاسم</label><input id="cn"><label>رقم الهاتف</label><input id="cp" inputmode="tel">`,()=>{
    const name=$('#cn').value.trim();
    if(!name)return toast('اكتب اسم العميل');
    db.customers.push({id:uid(),name,phone:$('#cp').value.trim()});
    save();closeM();render();
  });
}
function cPay(id){
  const c=cust(id),d=debtOf(id);
  modal('سداد من '+esc(c.name),`<p>المتبقي: <b class="debt">${fmt(d)} ج</b></p><label>المبلغ المدفوع (ج)</label><input id="pa" type="number" min="0" inputmode="decimal" value="${d}">`,()=>{
    const a=round(num($('#pa').value));
    if(a<=0)return toast('اكتب مبلغ صحيح');
    if(a>d)return toast('المبلغ أكبر من الدين المتبقي');
    db.payments.push({id:uid(),cid:id,amt:a,date:new Date().toISOString()});
    save();closeM();render();toast('تم تسجيل السداد ✔');
  },'تأكيد السداد');
}
function cStmt(id){
  const c=cust(id);
  const rows=[...db.invoices.filter(i=>i.cid===id).map(i=>({d:i.date,t:'فاتورة #'+i.no,a:i.total-i.paid})),
    ...db.payments.filter(p=>p.cid===id).map(p=>({d:p.date,t:'سداد',a:-p.amt}))].sort((x,y)=>x.d<y.d?-1:1);
  modal('كشف حساب: '+esc(c.name),rows.length?rows.map(r=>`<div class="row"><div>${r.t}<br><small>${fdate(r.d)}</small></div><b class="${r.a>0?'debt':''}" style="${r.a<0?'color:var(--ok)':''}">${r.a>0?'+':''}${fmt(r.a)}</b></div>`).join('')+`<div class="row"><b>المتبقي</b><b class="debt">${fmt(debtOf(id))} ج</b></div>`:'<p class="mut">مفيش حركات.</p>');
}
function cDel(id){
  if(debtOf(id))return toast('مينفعش تحذف عميل عليه دين');
  confirmBox('حذف العميل "'+cust(id).name+'"؟',()=>{db.customers=db.customers.filter(c=>c.id!==id);save();render();});
}

/* ---------- Invoices ---------- */
function vInv(v){
  const today=new Date().toDateString();
  const ts=db.invoices.filter(i=>new Date(i.date).toDateString()===today).reduce((s,i)=>s+i.total,0);
  v.innerHTML=`<div class="card row"><span>مبيعات النهارده</span><b class="total">${fmt(ts)} ج</b></div>`+
  (db.invoices.length?db.invoices.slice().reverse().slice(0,200).map(i=>{const c=cust(i.cid);
    return `<div class="card row" onclick="invView('${i.id}')" style="cursor:pointer"><div><b>فاتورة #${i.no}</b> <span class="tag ${i.method}">${i.method==='cash'?'كاش':'آجل'}</span><br><small>${fdate(i.date)}${c?' · '+esc(c.name):''}</small></div><b>${fmt(i.total)} ج</b></div>`;}).join(''):'<p class="mut">مفيش فواتير لسه.</p>');
}

  const t='*'+db.store+'*\nفاتورة #'+i.no+' - '+fdate(i.date)+'\n'+i.items.map(x=>x.name+' × '+x.qty+' = '+fmt(x.qty*x.price)).join('\n')+(i.disc?'\nخصم: '+fmt(i.disc):'')+'\n*الإجمالي: '+fmt(i.total)+' ج*'+(i.method==='credit'?'\nالمدفوع: '+fmt(i.paid)+'\nالمتبقي: '+fmt(i.total-i.paid):'')+'\nشكراً لتعاملكم معنا 🌷';
  const ph=c&&c.phone?c.phone.replace(/\D/g,''):'';
  window.open('https://wa.me/'+(ph?(ph.startsWith('0')?'2'+ph:ph):'')+'?text='+encodeURIComponent(t),'_blank');
}
function invView(id){
  const i=db.invoices.find(x=>x.id===id),c=cust(i.cid);
  modal('فاتورة #'+i.no,`<small>${fdate(i.date)}${c?' · '+esc(c.name):''}</small>`+
    i.items.map(t=>`<div class="row"><span>${esc(t.name)} (${t.qty} × ${fmt(t.price)})</span><b>${fmt(t.qty*t.price)}</b></div>`).join('')+
    (i.disc?`<div class="row"><span>خصم</span><b>-${fmt(i.disc)}</b></div>`:'')+
    `<div class="row"><b>الإجمالي</b><b class="total">${fmt(i.total)} ج</b></div>`+
    (i.method==='credit'?`<div class="row"><span>المدفوع وقت البيع</span><b>${fmt(i.paid)}</b></div><div class="row"><span>اتسجل دين</span><b class="debt">${fmt(i.total-i.paid)}</b></div>`:'')+`<div class="btns"><button class="btn sm" onclick="shareInv('${i.id}')">📤 إرسال واتساب</button><button class="btn ghost sm" onclick="printInv('${i.id}')">🖨 طباعة</button></div>`);
}

/* ---------- Settings & backup ---------- */
function vSet(v){
  v.innerHTML=`<div class="card"><h3>اسم المحل</h3><input value="${esc(db.store)}" onchange="db.store=this.value.trim()||'متجري';save();render()"></div>
  <div class="card"><h3>النسخ الاحتياطي</h3>
  <p class="mut">البيانات محفوظة على الجهاز ده بس. خد نسخة احتياطية بشكل دوري عشان متضيعش لو مسحت بيانات المتصفح.</p>
  <p class="mut">${db.products.length} منتج · ${db.customers.length} عميل · ${db.invoices.length} فاتورة</p>
  <div class="btns"><button class="btn" onclick="exportDb()">⬇ تصدير نسخة</button><button class="btn gold" onclick="$('#file').click()">⬆ استعادة نسخة</button></div></div>
  <div class="card"><h3>الفاتورة المطبوعة</h3>
  <label>تليفون / عنوان المحل (يظهر في الفاتورة)</label><input value="${esc(db.phone)}" onchange="db.phone=this.value.trim();save()">
  <label>رسالة أسفل الفاتورة</label><input value="${esc(db.foot)}" placeholder="شكراً لزيارتكم" onchange="db.foot=this.value.trim();save()">
  <label>عرض ورق الطابعة</label><select onchange="db.paper=this.value;save()"><option value="80" ${db.paper!=='58'?'selected':''}>80 مم (الأشهر)</option><option value="58" ${db.paper==='58'?'selected':''}>58 مم (صغير)</option></select></div>
  ${licCard()}<div class="card"><h3>مسح كل البيانات</h3><button class="btn bad" onclick="wipe()">مسح الكل</button></div>`;
}
function exportDb(){
  const blob=new Blob([JSON.stringify({app:'smart-micro-pos',version:1,exported:new Date().toISOString(),data:db},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='pos-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast('تم تصدير النسخة الاحتياطية ✔');
}
function importDb(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result),d=j.data||j;
      if(!Array.isArray(d.products)||!Array.isArray(d.invoices))throw new Error('bad');
      const n=norm(d);
      confirmBox(`هيتم استبدال البيانات الحالية بالنسخة دي (${n.products.length} منتج، ${n.customers.length} عميل، ${n.invoices.length} فاتورة). متأكد؟`,()=>{
        db=n;cart=[];disc=0;save();render();toast('تمت الاستعادة بنجاح ✔');
      });
    }catch(e){toast('الملف مش صالح');}
    inp.value='';
  };
  r.readAsText(f);
}
function wipe(){
  confirmBox('هيتم مسح كل المنتجات والعملاء والفواتير نهائياً. متأكد؟',()=>{db=norm({});cart=[];disc=0;save();render();toast('تم المسح');});
}

/* ---------- License (offline, signed keys) ---------- */
/* ضع المفتاح العام من keygen.html مكان null. لو سيبته null التطبيق يشتغل بدون تفعيل (للتجربة بس) */
const PUB={"kty":"EC","crv":"P-256","x":"gSet1x_vFV6GqdoxJuHFoHSXYNgiNxw2fGcs9tz-v2Q","y":"9jD8NlKjK57buSWg1Dha0iQ7PaEJbQHjHlyhUxE9K5M"};
const KS='smartpos_lic',KL='smartpos_last';
const DEV=(()=>{try{
  let d=localStorage.getItem('smartpos_dev');
  if(!d){d=Array.from(crypto.getRandomValues(new Uint8Array(8)),x=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x%32]).join('').replace(/(.{4})(.{4})/,'$1-$2');localStorage.setItem('smartpos_dev',d);}
  return d;}catch(e){return 'UNKNOWN';}})();
let LIC=null;
const unb64u=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const today=()=>new Date(Math.max(Date.now(),+localStorage.getItem(KL)||0)).toISOString().slice(0,10);
async function verify(key){
  try{
    const [p,s]=key.split('.');
    const k=await crypto.subtle.importKey('jwk',PUB,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
    if(!await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},k,unb64u(s),new TextEncoder().encode(p)))return{err:'كود التفعيل غير صحيح'};
    const d=JSON.parse(new TextDecoder().decode(unb64u(p)));
    if(d.d!==DEV)return{err:'الكود ده متعمل لجهاز تاني'};
    if(d.e!=='LIFE'&&today()>d.e)return{err:'الاشتراك انتهى يوم '+d.e+'. اطلب كود تجديد.'};
    return{ok:1,d};
  }catch(e){return{err:'كود التفعيل غير صحيح'};}
}
function lockScreen(msg){
  let el=$('#lock');
  if(!el){el=document.createElement('div');el.id='lock';document.body.appendChild(el);}
  el.innerHTML=`<div class="lk"><h3>تفعيل التطبيق</h3><p class="mut">${esc(msg)}</p>
  <label>رقم الجهاز (ابعته لصاحب التطبيق)</label><div class="dev">${DEV}</div>
  <button class="btn ghost" onclick="if(navigator.clipboard)navigator.clipboard.writeText(DEV);toast('تم نسخ الرقم')">نسخ الرقم</button>
  <label style="display:block;margin-top:10px">كود التفعيل</label><textarea id="lk" rows="4" placeholder="الصق الكود هنا"></textarea>
  <button class="btn gold" onclick="activate()">تفعيل</button></div>`;
}
async function activate(){
  const key=$('#lk').value.replace(/\s/g,'');
  const r=await verify(key);
  if(!r.ok)return toast(r.err);
  localStorage.setItem(KS,key);boot();
}
function licCard(){
  return `<div class="card"><h3>الترخيص</h3><p class="mut">${PUB&&LIC?`المحل: ${esc(LIC.s)}<br>${LIC.e==='LIFE'?'نسخة دائمة':'الاشتراك ينتهي: '+LIC.e}<br>رقم الجهاز: <b dir="ltr">${DEV}</b>`:'نسخة تجريبية غير مرخصة'}</p></div>`;
}
async function boot(){
  if(!PUB){render();return;}
  if(!(window.crypto&&crypto.subtle))return lockScreen('افتح التطبيق من الرابط الأساسي (https) عشان التفعيل يشتغل.');
  try{localStorage.setItem(KL,today());}catch(e){}
  const saved=localStorage.getItem(KS)||'';
  const r=await verify(saved);
  if(!r.ok)return lockScreen(saved?r.err:'اطلب كود التفعيل من صاحب التطبيق وابعتله رقم الجهاز.');
  LIC=r.d;
  const el=$('#lock');if(el)el.remove();
  render();
  if(LIC.e!=='LIFE'){const n=Math.ceil((new Date(LIC.e)-new Date(today()))/864e5);if(n<=7)toast('الاشتراك هينتهي بعد '+n+' يوم');}
}

if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
boot();
</script>
